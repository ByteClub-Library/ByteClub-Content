name: Incremental Indexing

"on":
  push:
    branches:
      - main

jobs:
  index:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema requests

      - name: Run incremental indexing
        run: python .github/actions/index_entries.py

      - name: Comment PR/issue with Indexing Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const total = parseInt(process.env.GITHUB_CHANGED_TOTAL) || 0;
            const added = process.env.GITHUB_CHANGED_ADDED || '';
            const modified = process.env.GITHUB_CHANGED_MODIFIED || '';
            const deleted = process.env.GITHUB_CHANGED_DELETED || '';
            
            let result = '**Indexing Status**: Complete\n';
            result += `- **Total changed**: ${total} entries\n`;
            result += `- **Added**: ${added ? added.split(',').length : 0} entries\n`;
            result += `- **Modified**: ${modified ? modified.split(',').length : 0} entries\n`;
            result += `- **Deleted**: ${deleted ? deleted.split(',').length : 0} entries\n`;
            result += `\nThe incremental indexing workflow has completed. Only affected entries were synced to the API.\n---\n*This is an automated indexing run.*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result
            })