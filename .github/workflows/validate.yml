name: Validate PR

"on":
  pull_request:
    paths:
      - 'entries/**'
      - 'templates/entry.yaml'
      - 'docs/**'
      - 'schema/entry.schema.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run entry validation
        run: python scripts/validate.py

      - name: Add validation comment
        if: always()
        uses: actions/github-script@v7
        with:
          comment_mode: update
          script: |
            github.restissues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**Validation Status**: check\n\nThe validation workflow has completed. Check the logs above for details on any entries that were validated.\n---\n*This is an automated validation run.*'
            })